version: '6.2'
services:
  redis-main:
    image: redis:6.2
    restart: always
    ports:
      - '6000:6379'
    command: redis-server --loglevel warning
    volumes:
      - redis-main-data:/data

  redis-ru:
    image: redis:6.2
    restart: always
    ports:
      - '6001:6379'
    command: redis-server --loglevel warning
    volumes:
      - redis-ru-data:/data

  redis-fr:
    image: redis:6.2
    restart: always
    ports:
      - '6002:6379'
    command: redis-server --loglevel warning
    volumes:
      - redis-fr-data:/data

  redis-eu:
    image: redis:6.2
    restart: always
    ports:
      - '6003:6379'
    command: redis-server --loglevel warning
    volumes:
      - redis-eu-data:/data

  redis-uae:
    image: redis:6.2
    restart: always
    ports:
      - '6004:6379'
    command: redis-server --loglevel warning
    volumes:
      - redis-uae-data:/data

  redis-asia:
    image: redis:6.2
    restart: always
    ports:
      - '6005:6379'
    command: redis-server --loglevel warning
    volumes:
      - redis-asia-data:/data

  rabbitmq-pa3:
    image: rabbitmq:3.13.7-management
    container_name: rabbitmq-pa3
    hostname: rabbitmq-pa3
    environment:
      - RABBITMQ_DEFAULT_USER=kirill
      - RABBITMQ_DEFAULT_PASS=12345
      - RABBITMQ_DEFAULT_VHOST=/
    volumes:
      - rabbitmq_pa3_data:/var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

volumes:
  redis-main-data:
  redis-ru-data:
  redis-fr-data:
  redis-eu-data:
  redis-uae-data:
  redis-asia-data:
  rabbitmq_pa3_data: